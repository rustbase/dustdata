[package]
name = "dustdata"
version = "2.0.0-beta.5"
edition = "2021"
description = "A data concurrency control storage engine to Rustbase"
repository = "https://github.com/rustbase/dustdata"
homepage = "https://github.com/rustbase/dustdata"
authors = ["Rustbase"]
license = "MIT"
exclude = [
    "test_data/*",
    "README.md",
    "CONTRIBUTING.md",
    ".editorconfig",
    ".cargo/*",
]
build = "./src/build.rs"

[lib]
doctest = false

[dependencies]
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
bloomfilter = "1.0"
fs2 = "0.4.3"
bincode = "1.3.3"
crc32fast = "1.4.2"
glob = "0.3.1"

[build-dependencies]
hooky-rs = "1.0.0"
